<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 160" width="100%" height="100%">
  <g transform="translate(150, 62)" text-anchor="middle">
    <!-- Star of David / Globe and Orbit Emblem -->
    <g transform="translate(-40, 0)">
      <circle cx="0" cy="0" r="22" fill="none" stroke="#003580" stroke-width="3.5" />
      <!-- Star of David -->
      <polygon points="0,-14 12,7 -12,7" fill="none" stroke="#003580" stroke-width="2.5" />
      <polygon points="0,14 12,-7 -12,-7" fill="none" stroke="#003580" stroke-width="2.5" />
      <!-- Orbit ring cutting across -->
      <path d="M-28,14 Q0,-22 28,-14" fill="none" stroke="#003580" stroke-width="3" stroke-linecap="round" />
    </g>

    <!-- Bold Italic IAI -->
    <text x="25" y="14" font-family="'Impact', 'Arial Black', sans-serif" font-size="44" font-weight="900" font-style="italic" fill="#003580" letter-spacing="1">IAI</text>
  </g>
  <!-- Subtitle -->
  <text x="150" y="112" text-anchor="middle" font-family="'Arial', sans-serif" font-size="11" font-weight="700" fill="#003580" letter-spacing="0.4">Israel Aerospace Industries</text>
</svg>
